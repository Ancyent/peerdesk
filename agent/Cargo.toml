[package]
name = "peerdesk-agent"
version = "0.2.0"
edition = "2021"

[lib]
name = "peerdesk_agent"
path = "src/lib.rs"

[[bin]]
name = "peerdesk-agent"
path = "src/main.rs"

[features]
# On by default: full GUI host — screen capture (xcap+openh264), input injection
# (enigo), cursor readout, clipboard sync (arboard), audio (cpal). Build a headless
# terminal-only agent with `cargo build --no-default-features` — it drops these
# crates and their pipewire/X11/ALSA linkage so it runs on minimal/headless boxes.
default = ["gui-capture"]
gui-capture = ["dep:xcap", "dep:openh264", "dep:enigo", "dep:arboard", "dep:cpal"]

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `wgc` = Windows Graphics Capture recorder. Without it xcap falls back to DXGI
# Desktop Duplication, which can't capture a monitor driven by a secondary GPU
# (hybrid graphics) — it fails with E_INVALIDARG. WGC captures any monitor.
# Windows-only feature; no effect on the Linux/macOS build.
#
# xcap/openh264/enigo/arboard/cpal are gated behind the default `gui-capture`
# feature so a headless agent (`--no-default-features`) links no pipewire/X11/
# audio libs and runs on minimal/headless servers (terminal mode only).
xcap = { version = "0.9", features = ["wgc"], optional = true }
openh264 = { version = "0.6", optional = true }
webrtc = "0.11"
enigo = { version = "0.2", optional = true }
arboard = { version = "3", optional = true }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
bcrypt = "0.15"
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
tracing-appender = "0.2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
cpal = { version = "0.15", optional = true }
portable-pty = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
