[package]
name = "peerdesk-agent"
version = "0.2.0"
edition = "2021"

[lib]
name = "peerdesk_agent"
path = "src/lib.rs"

[[bin]]
name = "peerdesk-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `wgc` = Windows Graphics Capture recorder. Without it xcap falls back to DXGI
# Desktop Duplication, which can't capture a monitor driven by a secondary GPU
# (hybrid graphics) — it fails with E_INVALIDARG. WGC captures any monitor.
# Windows-only feature; no effect on the Linux/macOS build.
xcap = { version = "0.9", features = ["wgc"] }
openh264 = "0.6"
webrtc = "0.11"
enigo = "0.2"
arboard = "3"
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
bcrypt = "0.15"
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
tracing-appender = "0.2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
cpal = "0.15"
portable-pty = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
