<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PeerDesk</title>
    <script>
      // Before the critical reset below, because that reset now paints a
      // theme-dependent colour. Same logic as shared/ui/theme.ts, inlined so it
      // runs ahead of the bundle.
      (function () {
        try {
          var t = localStorage.getItem('pd-theme') || 'system';
          if (t === 'system') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          // Storage can throw; bare :root is the dark set, so this is already
          // the right fallback.
        }
      })();
    </script>
    <style>
      /* Critical reset — applied before the bundle so there is no white border
         or flash around the frameless window at first paint. The background is
         written twice, once per theme, because styles.css has not loaded yet
         and these literals must match --bg-base in it. */
      html, body, #root { margin: 0; padding: 0; height: 100%; background: #0b111c; }
      html[data-theme='light'], html[data-theme='light'] body,
      html[data-theme='light'] #root { background: #eef2f7; }
      body { overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
