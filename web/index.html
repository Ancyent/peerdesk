<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- SVG first (sharp at any size); the PNG/ICO entries are fallbacks for
         browsers and platforms that ignore SVG favicons. All generated by
         scripts/generate-icons.py — do not hand-edit. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/peerdesk-icon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/peerdesk-icon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/peerdesk-icon-180x180.png" />
    <link rel="alternate icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>web</title>
    <script>
      // Runs before the bundle so a light-theme user never sees a dark frame.
      // Kept inline and dependency-free on purpose; the same logic lives in
      // shared/ui/theme.ts for everything after first paint.
      (function () {
        try {
          var t = localStorage.getItem('pd-theme') || 'system';
          if (t === 'system') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          // Storage can throw; the stylesheet's bare :root is dark, so doing
          // nothing here is already the correct fallback.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
