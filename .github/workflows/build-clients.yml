name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:

  # ── Agent: Linux ──────────────────────────────────────────
  build-agent-linux:
    name: Agent — Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxdo-dev libasound2-dev libx11-dev libssl-dev libxtst-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev
      - name: Build agent
        run: cargo build -p peerdesk-agent --release
      - name: Rename binary
        run: cp target/release/peerdesk-agent peerdesk-agent-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: agent-linux
          path: peerdesk-agent-linux-x86_64

  # ── Agent: Windows ────────────────────────────────────────
  build-agent-windows:
    name: Agent — Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Build agent
        run: cargo build -p peerdesk-agent --release
      - name: Rename binary
        run: cp target/release/peerdesk-agent.exe peerdesk-agent-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: agent-windows
          path: peerdesk-agent-windows-x86_64.exe

  # ── Agent: macOS Universal ────────────────────────────────
  build-agent-macos:
    name: Agent — macOS Universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Build agent (x86_64)
        run: cargo build -p peerdesk-agent --release --target x86_64-apple-darwin
      - name: Build agent (arm64)
        run: cargo build -p peerdesk-agent --release --target aarch64-apple-darwin
      - name: Create universal binary
        run: |
          lipo \
            target/x86_64-apple-darwin/release/peerdesk-agent \
            target/aarch64-apple-darwin/release/peerdesk-agent \
            -create -output peerdesk-agent-macos-universal
      - uses: actions/upload-artifact@v4
        with:
          name: agent-macos
          path: peerdesk-agent-macos-universal

  # ── Viewer Tauri: Linux ───────────────────────────────────
  build-viewer-linux:
    name: Viewer — Linux (.deb + .AppImage)
    continue-on-error: true
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf \
            libxdo-dev libasound2-dev libx11-dev libssl-dev libxtst-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build frontend
        run: cd desktop && npm ci && npm run build
      - name: Build Linux packages
        run: cd desktop && cargo tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-linux
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage

  # ── Viewer Tauri: Windows ─────────────────────────────────
  build-viewer-windows:
    name: Viewer — Windows (.msi + .exe)
    continue-on-error: true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build frontend
        run: cd desktop && npm ci && npm run build
      - name: Build Windows packages
        run: cd desktop && cargo tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-windows
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe

  # ── Viewer Tauri: macOS ───────────────────────────────────
  build-viewer-macos:
    name: Viewer — macOS (.dmg Universal)
    continue-on-error: true
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build frontend
        run: cd desktop && npm ci && npm run build
      - name: Build macOS Universal
        run: cd desktop && cargo tauri build --target universal-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-macos
          path: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  # ── Viewer Tauri: Android ─────────────────────────────────
  build-viewer-android:
    name: Viewer — Android (.apk)
    continue-on-error: true
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager "ndk;26.1.10909125"
      - name: Install Rust Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          sudo apt-get install -y libxdo-dev libasound2-dev
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build frontend
        run: cd desktop && npm ci && npm run build
      - name: Init Android (if needed)
        run: |
          if [[ ! -d "desktop/src-tauri/gen/android" ]]; then
            cd desktop && cargo tauri android init
          fi
      - name: Build APK
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
        run: cd desktop && cargo tauri android build --apk
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-android
          path: desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  # ── Release ───────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs:
      - build-agent-linux
      - build-agent-windows
      - build-agent-macos
      - build-viewer-linux
      - build-viewer-windows
      - build-viewer-macos
      - build-viewer-android
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && !cancelled()
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List artifacts
        run: find . -type f | sort

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            agent-linux/peerdesk-agent-linux-x86_64
            agent-windows/peerdesk-agent-windows-x86_64.exe
            agent-macos/peerdesk-agent-macos-universal
            viewer-linux/*.deb
            viewer-linux/*.AppImage
            viewer-windows/*.msi
            viewer-windows/*.exe
            viewer-macos/*.dmg
            viewer-android/**/*.apk
