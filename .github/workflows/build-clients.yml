name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:

  # ── Agent: Linux ──────────────────────────────────────────
  build-agent-linux:
    name: Agent — Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxdo-dev libasound2-dev libx11-dev libssl-dev libxtst-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev \
            libpipewire-0.3-dev libgbm-dev libegl1-mesa-dev \
            libwayland-dev libxkbcommon-dev
      - name: Build agent
        run: cargo build -p peerdesk-agent --release
      - name: Rename binary
        run: cp target/release/peerdesk-agent peerdesk-agent-linux-x86_64-${{ github.ref_name }}
      # Headless variant: --no-default-features drops xcap/openh264/enigo/arboard/
      # cpal, so this binary links no pipewire/X11/ALSA libs and starts on minimal
      # or headless servers (CentOS/RHEL, old Debian/Ubuntu). Terminal mode only.
      - name: Build headless agent
        run: cargo build -p peerdesk-agent --release --no-default-features
      - name: Rename headless binary
        run: cp target/release/peerdesk-agent peerdesk-agent-linux-x86_64-headless-${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: agent-linux
          path: |
            peerdesk-agent-linux-x86_64-${{ github.ref_name }}
            peerdesk-agent-linux-x86_64-headless-${{ github.ref_name }}

  # ── Agent: Windows ────────────────────────────────────────
  build-agent-windows:
    name: Agent — Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build agent
        run: cargo build -p peerdesk-agent --release
      - name: Rename binary
        run: cp target/release/peerdesk-agent.exe peerdesk-agent-windows-x86_64-${{ github.ref_name }}.exe
      - uses: actions/upload-artifact@v4
        with:
          name: agent-windows
          path: peerdesk-agent-windows-x86_64-${{ github.ref_name }}.exe

  # ── Viewer Tauri: Linux ───────────────────────────────────
  build-viewer-linux:
    name: Viewer — Linux (.deb + .AppImage)
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            rpm \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf \
            libxdo-dev libasound2-dev libx11-dev libssl-dev libxtst-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev \
            libpipewire-0.3-dev libgbm-dev libegl1-mesa-dev \
            libwayland-dev libxkbcommon-dev
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Set app version from tag
        shell: bash
        run: |
          VER="${{ github.ref_name }}"; VER="${VER#v}"
          node -e "const fs=require('fs'),p='desktop/src-tauri/tauri.conf.json',j=JSON.parse(fs.readFileSync(p));j.version='$VER';fs.writeFileSync(p,JSON.stringify(j,null,2))"
          echo "app version set to $VER"
      - name: Build frontend
        run: cd desktop && npm ci && npm run build
      - name: Build Linux packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cd desktop && cargo tauri build
      - name: Collect artifacts
        run: |
          VERSION="${{ github.ref_name }}"
          mkdir -p dist
          for f in desktop/src-tauri/target/release/bundle/deb/*.deb; do
            [ -f "$f" ] && cp "$f" "dist/peerdesk-viewer-linux-${VERSION}-amd64.deb"
          done
          for f in desktop/src-tauri/target/release/bundle/appimage/*.AppImage; do
            [ -f "$f" ] && cp "$f" "dist/peerdesk-viewer-linux-${VERSION}.AppImage"
            [ -f "$f.sig" ] && cp "$f.sig" "dist/peerdesk-viewer-linux-${VERSION}.AppImage.sig"
          done
          for f in desktop/src-tauri/target/release/bundle/rpm/*.rpm; do
            [ -f "$f" ] && cp "$f" "dist/peerdesk-viewer-linux-${VERSION}-x86_64.rpm"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-linux
          path: dist/
          if-no-files-found: warn

  # ── Viewer Tauri: Windows ─────────────────────────────────
  build-viewer-windows:
    name: Viewer — Windows (.msi + setup .exe + portable .exe)
    continue-on-error: true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Set app version from tag
        shell: bash
        run: |
          VER="${{ github.ref_name }}"; VER="${VER#v}"
          node -e "const fs=require('fs'),p='desktop/src-tauri/tauri.conf.json',j=JSON.parse(fs.readFileSync(p));j.version='$VER';fs.writeFileSync(p,JSON.stringify(j,null,2))"
          echo "app version set to $VER"
      - name: Build frontend
        run: cd desktop && npm ci && npm run build
      - name: Build Windows packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cd desktop && cargo tauri build
      - name: Collect artifacts
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          mkdir -p dist
          for f in desktop/src-tauri/target/release/bundle/msi/*.msi; do
            [ -f "$f" ] && cp "$f" "dist/peerdesk-viewer-windows-${VERSION}-x64.msi"
          done
          for f in desktop/src-tauri/target/release/bundle/nsis/*.exe; do
            [ -f "$f" ] && cp "$f" "dist/peerdesk-viewer-windows-${VERSION}-x64-setup.exe"
            [ -f "$f.sig" ] && cp "$f.sig" "dist/peerdesk-viewer-windows-${VERSION}-x64-setup.exe.sig"
          done
          # portable: the raw standalone app exe (needs WebView2 runtime on the host)
          SRC=desktop/src-tauri/target/release/peerdesk-desktop.exe
          [ -f "$SRC" ] || SRC=desktop/src-tauri/target/release/PeerDesk.exe
          [ -f "$SRC" ] && cp "$SRC" "dist/peerdesk-viewer-windows-${VERSION}-portable.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-windows
          path: dist/
          if-no-files-found: warn

  # ── Viewer Tauri: Android ─────────────────────────────────
  build-viewer-android:
    name: Viewer — Android (.apk)
    continue-on-error: true
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager "ndk;26.1.10909125"
      - name: Install Rust Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          sudo apt-get update
          sudo apt-get install -y libxdo-dev libasound2-dev
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Set app version from tag
        shell: bash
        run: |
          VER="${{ github.ref_name }}"; VER="${VER#v}"
          node -e "const fs=require('fs'),p='desktop/src-tauri/tauri.conf.json',j=JSON.parse(fs.readFileSync(p));j.version='$VER';fs.writeFileSync(p,JSON.stringify(j,null,2))"
          echo "app version set to $VER"
      - name: Build frontend
        run: cd desktop && npm ci && npm run build
      - name: Init Android
        run: cd desktop && cargo tauri android init
      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          python3 -c "import base64,os; open('/tmp/release.jks','wb').write(base64.decodebytes(os.environ['ANDROID_KEYSTORE_B64'].encode()))"
          cat >> desktop/src-tauri/gen/android/app/build.gradle.kts << 'GRADLE_EOF'

          android {
              signingConfigs {
                  create("release") {
                      storeFile = file("/tmp/release.jks")
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")!!
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")!!
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")!!
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          GRADLE_EOF
      - name: Build APK (signed release)
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd desktop && cargo tauri android build --apk
      - name: Collect artifacts
        run: |
          VERSION="${{ github.ref_name }}"
          mkdir -p dist
          find desktop/src-tauri/gen/android/app/build/outputs/apk/release -name '*.apk' | while read f; do
            cp "$f" "dist/peerdesk-android-${VERSION}.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-android
          path: dist/
          if-no-files-found: warn

  # ── Release ───────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs:
      - build-agent-linux
      - build-agent-windows
      - build-viewer-linux
      - build-viewer-windows
      - build-viewer-android
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && !cancelled()
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List artifacts
        run: find . -type f | sort

      - name: Warn if signed viewer bundles are missing
        run: |
          missing=0
          ls viewer-linux/peerdesk-viewer-linux-*.AppImage.sig >/dev/null 2>&1 \
            || { echo "::warning::No Linux .AppImage.sig — updater signing likely failed (are TAURI_SIGNING_PRIVATE_KEY/_PASSWORD set, and did the viewer-linux build pass?)"; missing=1; }
          ls viewer-windows/peerdesk-viewer-windows-*-setup.exe.sig >/dev/null 2>&1 \
            || { echo "::warning::No Windows setup.exe.sig — updater signing likely failed (are TAURI_SIGNING_PRIVATE_KEY/_PASSWORD set, and did the viewer-windows build pass?)"; missing=1; }
          [ "$missing" = 0 ] && echo "Signed viewer updater bundles present." || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            agent-linux/peerdesk-agent-linux-x86_64-*
            agent-windows/peerdesk-agent-windows-x86_64-*.exe
            viewer-linux/peerdesk-viewer-linux-*.deb
            viewer-linux/peerdesk-viewer-linux-*.rpm
            viewer-linux/peerdesk-viewer-linux-*.AppImage
            viewer-linux/peerdesk-viewer-linux-*.AppImage.sig
            viewer-windows/peerdesk-viewer-windows-*.msi
            viewer-windows/peerdesk-viewer-windows-*-setup.exe
            viewer-windows/peerdesk-viewer-windows-*-setup.exe.sig
            viewer-windows/peerdesk-viewer-windows-*-portable.exe
            viewer-android/peerdesk-android-*.apk
