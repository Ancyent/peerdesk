name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:

  # ── Agent: Linux ──────────────────────────────────────────
  build-agent-linux:
    name: Agent — Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxdo-dev libasound2-dev libx11-dev libssl-dev libxtst-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev \
            libpipewire-0.3-dev libgbm-dev libegl1-mesa-dev \
            libwayland-dev libxkbcommon-dev
      - name: Build agent
        run: cargo build -p peerdesk-agent --release
      - name: Rename binary
        run: cp target/release/peerdesk-agent peerdesk-agent-linux-x86_64-${{ github.ref_name }}
      # Headless variant: --no-default-features drops xcap/openh264/enigo/arboard/
      # cpal, so this binary links no pipewire/X11/ALSA libs and starts on minimal
      # or headless servers (CentOS/RHEL, old Debian/Ubuntu). Terminal mode only.
      - name: Build headless agent
        run: cargo build -p peerdesk-agent --release --no-default-features
      - name: Rename headless binary
        run: cp target/release/peerdesk-agent peerdesk-agent-linux-x86_64-headless-${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: agent-linux
          path: |
            peerdesk-agent-linux-x86_64-${{ github.ref_name }}
            peerdesk-agent-linux-x86_64-headless-${{ github.ref_name }}

  # ── Agent: Windows ────────────────────────────────────────
  build-agent-windows:
    name: Agent — Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build agent
        run: cargo build -p peerdesk-agent --release
      - name: Rename binary
        run: cp target/release/peerdesk-agent.exe peerdesk-agent-windows-x86_64-${{ github.ref_name }}.exe
      - uses: actions/upload-artifact@v4
        with:
          name: agent-windows
          path: peerdesk-agent-windows-x86_64-${{ github.ref_name }}.exe

  # ── Viewer Tauri: Linux ───────────────────────────────────
  build-viewer-linux:
    name: Viewer — Linux (.deb + .AppImage)
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            rpm \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf \
            libxdo-dev libasound2-dev libx11-dev libssl-dev libxtst-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev \
            libpipewire-0.3-dev libgbm-dev libegl1-mesa-dev \
            libwayland-dev libxkbcommon-dev
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Set app version from tag
        shell: bash
        run: |
          VER="${{ github.ref_name }}"; VER="${VER#v}"
          node -e "const fs=require('fs'),p='desktop/src-tauri/tauri.conf.json',j=JSON.parse(fs.readFileSync(p));j.version='$VER';fs.writeFileSync(p,JSON.stringify(j,null,2))"
          echo "app version set to $VER"
      - name: Build frontend
        run: cd desktop && npm ci && npm run build
      - name: Build Linux packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cd desktop && cargo tauri build
      - name: Collect artifacts
        run: |
          VERSION="${{ github.ref_name }}"
          mkdir -p dist
          for f in desktop/src-tauri/target/release/bundle/deb/*.deb; do
            [ -f "$f" ] && cp "$f" "dist/peerdesk-viewer-linux-${VERSION}-amd64.deb"
          done
          for f in desktop/src-tauri/target/release/bundle/appimage/*.AppImage; do
            [ -f "$f" ] && cp "$f" "dist/peerdesk-viewer-linux-${VERSION}.AppImage"
            [ -f "$f.sig" ] && cp "$f.sig" "dist/peerdesk-viewer-linux-${VERSION}.AppImage.sig"
          done
          for f in desktop/src-tauri/target/release/bundle/rpm/*.rpm; do
            [ -f "$f" ] && cp "$f" "dist/peerdesk-viewer-linux-${VERSION}-x86_64.rpm"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-linux
          path: dist/
          if-no-files-found: warn

  # ── Viewer Tauri: Windows ─────────────────────────────────
  build-viewer-windows:
    name: Viewer — Windows (.msi + setup .exe + portable .exe)
    continue-on-error: true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Set app version from tag
        shell: bash
        run: |
          VER="${{ github.ref_name }}"; VER="${VER#v}"
          node -e "const fs=require('fs'),p='desktop/src-tauri/tauri.conf.json',j=JSON.parse(fs.readFileSync(p));j.version='$VER';fs.writeFileSync(p,JSON.stringify(j,null,2))"
          echo "app version set to $VER"
      - name: Build frontend
        run: cd desktop && npm ci && npm run build
      - name: Build Windows packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cd desktop && cargo tauri build
      - name: Collect artifacts
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          mkdir -p dist
          for f in desktop/src-tauri/target/release/bundle/msi/*.msi; do
            [ -f "$f" ] && cp "$f" "dist/peerdesk-viewer-windows-${VERSION}-x64.msi"
          done
          for f in desktop/src-tauri/target/release/bundle/nsis/*.exe; do
            [ -f "$f" ] && cp "$f" "dist/peerdesk-viewer-windows-${VERSION}-x64-setup.exe"
            [ -f "$f.sig" ] && cp "$f.sig" "dist/peerdesk-viewer-windows-${VERSION}-x64-setup.exe.sig"
          done
          # portable: the raw standalone app exe (needs WebView2 runtime on the host)
          SRC=desktop/src-tauri/target/release/peerdesk-desktop.exe
          [ -f "$SRC" ] || SRC=desktop/src-tauri/target/release/PeerDesk.exe
          [ -f "$SRC" ] && cp "$SRC" "dist/peerdesk-viewer-windows-${VERSION}-portable.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-windows
          path: dist/
          if-no-files-found: warn

  # ── Viewer Tauri: Android ─────────────────────────────────
  build-viewer-android:
    name: Viewer — Android (.apk)
    continue-on-error: true
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager "ndk;26.1.10909125"
      - name: Install Rust Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          sudo apt-get update
          sudo apt-get install -y libxdo-dev libasound2-dev
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Set app version from tag
        shell: bash
        run: |
          VER="${{ github.ref_name }}"; VER="${VER#v}"
          node -e "const fs=require('fs'),p='desktop/src-tauri/tauri.conf.json',j=JSON.parse(fs.readFileSync(p));j.version='$VER';fs.writeFileSync(p,JSON.stringify(j,null,2))"
          echo "app version set to $VER"
      - name: Build frontend
        run: cd desktop && npm ci && npm run build
      - name: Init Android
        run: cd desktop && cargo tauri android init
      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          python3 -c "import base64,os; open('/tmp/release.jks','wb').write(base64.decodebytes(os.environ['ANDROID_KEYSTORE_B64'].encode()))"
          cat >> desktop/src-tauri/gen/android/app/build.gradle.kts << 'GRADLE_EOF'

          android {
              signingConfigs {
                  create("release") {
                      storeFile = file("/tmp/release.jks")
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")!!
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")!!
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")!!
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          GRADLE_EOF
      - name: Build APK (signed release)
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd desktop && cargo tauri android build --apk
      # Searches the whole generated tree instead of a hardcoded output path.
      # The previous version pointed at .../outputs/apk/release and used
      # `find ... | while read`, so when the path stopped matching, find's error
      # went to stderr, the pipeline still exited 0, dist/ stayed empty, and
      # `if-no-files-found: warn` made the upload green too — v0.5.1 shipped
      # with no APK and nothing anywhere said so. Fail loudly instead.
      - name: Collect artifacts
        shell: bash
        run: |
          set -o pipefail
          VERSION="${{ github.ref_name }}"
          GEN=desktop/src-tauri/gen/android
          mkdir -p dist

          mapfile -t all < <(find "$GEN" -type f -name '*.apk' 2>/dev/null | sort)
          if [ ${#all[@]} -eq 0 ]; then
            echo "::error::No .apk found anywhere under $GEN — the build step reported success but produced nothing."
            echo "Directories present, for diagnosis:"
            find "$GEN" -type d -name outputs -o -type d -name '*release*' 2>/dev/null | head -40
            exit 1
          fi

          echo "APKs found:"; printf '  %s\n' "${all[@]}"

          mapfile -t apks < <(printf '%s\n' "${all[@]}" | grep -viE 'unsigned|/debug/' || true)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::Only unsigned or debug APKs were produced — refusing to ship one. Check the signing config."
            exit 1
          fi

          # A universal APK covers every ABI, so prefer it; otherwise keep each
          # split under its own name so they cannot overwrite one another.
          universal=""
          for f in "${apks[@]}"; do
            case "$f" in *universal*) universal="$f"; break ;; esac
          done

          if [ -n "$universal" ]; then
            cp "$universal" "dist/peerdesk-android-${VERSION}.apk"
          elif [ ${#apks[@]} -eq 1 ]; then
            cp "${apks[0]}" "dist/peerdesk-android-${VERSION}.apk"
          else
            for f in "${apks[@]}"; do
              abi=$(basename "$f" .apk | sed 's/^app-//; s/-release$//')
              cp "$f" "dist/peerdesk-android-${VERSION}-${abi}.apk"
            done
          fi

          echo "Collected:"; ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: viewer-android
          path: dist/
          # `warn` was the second half of the silent failure above.
          if-no-files-found: error

  # ── Release ───────────────────────────────────────────────
  #
  # Split in two on purpose. Only the desktop viewers feed the Tauri updater,
  # so only they are gated on signing. Agents and the Android APK do not use
  # the updater (Android gets notify+link), and blocking them because a desktop
  # bundle failed to sign would punish the wrong artifacts.
  #
  # Both jobs use `!cancelled()`, so each runs regardless of whether the other
  # — or its own build jobs — failed. `release-viewers` merely runs AFTER
  # `release-agents` so the two never race to create the same release.

  release-agents:
    name: Publish agents + Android
    needs:
      - build-agent-linux
      - build-agent-windows
      - build-viewer-android
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && !cancelled()
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List artifacts
        run: find . -type f | sort

      # Creates the release for this tag; release-viewers adds to it afterwards.
      - name: Publish agent and Android assets
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            agent-linux/peerdesk-agent-linux-x86_64-*
            agent-windows/peerdesk-agent-windows-x86_64-*.exe
            viewer-android/peerdesk-android-*.apk

  release-viewers:
    name: Publish desktop viewers (signed)
    needs:
      - build-viewer-linux
      - build-viewer-windows
      - release-agents
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && !cancelled()
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List artifacts
        run: find . -type f | sort

      # Hard gate, deliberately: an unsigned viewer publishes fine and looks
      # green, but the updater then silently stops working for every existing
      # desktop client. Refusing to publish the viewers is the cheaper failure
      # — fix the cause and re-run the tag. Agents and Android are unaffected;
      # they were published by release-agents.
      - name: Require signed viewer bundles
        run: |
          missing=0
          ls viewer-linux/peerdesk-viewer-linux-*.AppImage.sig >/dev/null 2>&1 \
            || { echo "::error::No Linux .AppImage.sig — updater signing failed (are TAURI_SIGNING_PRIVATE_KEY/_PASSWORD set, and did the viewer-linux build pass?)"; missing=1; }
          ls viewer-windows/peerdesk-viewer-windows-*-setup.exe.sig >/dev/null 2>&1 \
            || { echo "::error::No Windows setup.exe.sig — updater signing failed (are TAURI_SIGNING_PRIVATE_KEY/_PASSWORD set, and did the viewer-windows build pass?)"; missing=1; }
          if [ "$missing" != 0 ]; then
            echo "::error::Refusing to publish unsigned desktop viewers. Agents and Android were still published; fix the cause and re-run this tag."
            exit 1
          fi
          echo "Signed viewer updater bundles present."

      - name: Publish viewer assets
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          fail_on_unmatched_files: false
          files: |
            viewer-linux/peerdesk-viewer-linux-*.deb
            viewer-linux/peerdesk-viewer-linux-*.rpm
            viewer-linux/peerdesk-viewer-linux-*.AppImage
            viewer-linux/peerdesk-viewer-linux-*.AppImage.sig
            viewer-windows/peerdesk-viewer-windows-*.msi
            viewer-windows/peerdesk-viewer-windows-*-setup.exe
            viewer-windows/peerdesk-viewer-windows-*-setup.exe.sig
            viewer-windows/peerdesk-viewer-windows-*-portable.exe
