name: Server Tests

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server-tests.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-tests.yml'

concurrency:
  group: server-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (incl. real-Postgres migration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: server/api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Confirm Docker is available (migration tests need it)
        run: docker info

      - name: Run test suite
        run: python -m pytest -v --junitxml=pytest-results.xml

      - name: Verify migration tests actually ran (did not skip)
        if: always()
        run: |
          python - <<'PYEOF'
          import sys
          import xml.etree.ElementTree as ET

          try:
              tree = ET.parse("pytest-results.xml")
          except FileNotFoundError:
              print("::error::pytest-results.xml not found - the test run did not complete.")
              sys.exit(1)

          root = tree.getroot()

          migration_cases = [
              tc for tc in root.iter("testcase")
              if tc.get("classname", "").endswith("test_migrations")
          ]

          if not migration_cases:
              print("::error::No tests.test_migrations testcases found in the JUnit report - "
                    "the migration test module did not run at all.")
              sys.exit(1)

          skipped = [tc for tc in migration_cases if tc.find("skipped") is not None]
          if skipped:
              names = ", ".join(tc.get("name", "?") for tc in skipped)
              print(f"::error::{len(skipped)} migration test(s) were SKIPPED: {names}. "
                    "This almost always means Docker was unavailable to the postgres_container "
                    "fixture. A green build that silently skips the migration tests is worse than "
                    "no CI at all, so this is treated as a failure.")
              sys.exit(1)

          expected_min = 5
          if len(migration_cases) < expected_min:
              print(f"::error::Expected at least {expected_min} migration tests, "
                    f"found {len(migration_cases)}. Did test collection change?")
              sys.exit(1)

          print(f"OK: {len(migration_cases)} migration test(s) ran and none were skipped: "
                + ", ".join(tc.get("name", "?") for tc in migration_cases))
          PYEOF

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: server/api/pytest-results.xml
          if-no-files-found: warn
