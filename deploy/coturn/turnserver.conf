# PeerDesk coturn configuration
# Overridden at runtime by docker command flags

listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret

realm=peerdesk
min-port=49152
max-port=65535

# Log to stdout for Docker
log-file=stdout
verbose

# Security: no loopback/multicast relay
no-loopback-peers
no-multicast-peers
