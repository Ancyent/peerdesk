# PeerDesk — production without an external nginx proxy
# Use this when running behind another reverse proxy (Traefik, Caddy, external nginx, etc.)
# or directly on public ports without a proxy.
#
# config.json for this mode:
#   { "apiUrl": "http://IP-or-domain:8000", "signalingUrl": "ws://IP-or-domain:8001/ws" }
#
# Usage:
#   docker compose -f docker-compose.no-nginx.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peerdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-peerdesk}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-peerdesk}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    command: >
      -n
      --log-file=stdout
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET}
      --realm=peerdesk
      --min-port=49152
      --max-port=65535
      --no-stun
      --fingerprint
      --no-loopback-peers
      --no-multicast-peers

  api:
    build:
      context: ../server/api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-peerdesk}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-peerdesk}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  signaling:
    build:
      context: ../server/signaling
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  web:
    build:
      # Repo root, not ../web — see the note in docker-compose.yml.
      context: ..
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./config.json:/etc/peerdesk/config.json:ro
    depends_on:
      - api
      - signaling
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
