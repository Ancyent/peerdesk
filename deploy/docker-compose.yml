services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peerdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-peerdesk}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-peerdesk}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    environment:
      TURN_SECRET: ${TURN_SECRET}
      TURN_HOST: ${TURN_HOST:-localhost}
      TURN_PRIVATE_IP: ${TURN_PRIVATE_IP:-}
    # Behind NAT, coturn advertises the address it sees itself on — a private LAN
    # IP — so an external viewer is handed a relay candidate it cannot reach and
    # the session dies with a black screen and no error message anywhere.
    # --external-ip fixes that but accepts only a literal IP, while this
    # deployment's public address is dynamic (hence the DDNS name in TURN_HOST),
    # so resolve it at start.
    # A relay is UDP and can never travel through an HTTP reverse proxy: 3478 and
    # 49160-49200 must be port-forwarded straight to TURN_PRIVATE_IP.
    # NOTE: the mapping is fixed at container start. Restart this service when
    # the public IP changes, or the relay silently points at the old address.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        EXT=$$(getent hosts "$$TURN_HOST" | awk '{print $$1}' | head -1)
        if [ -n "$$EXT" ] && [ -n "$$TURN_PRIVATE_IP" ]; then
          MAP="--external-ip=$$EXT/$$TURN_PRIVATE_IP"
          echo "coturn: relay advertised as $$EXT (mapped from $$TURN_PRIVATE_IP)"
        else
          MAP=""
          echo "coturn: WARNING — no external-ip mapping (TURN_HOST='$$TURN_HOST' resolved='$$EXT' TURN_PRIVATE_IP='$$TURN_PRIVATE_IP'); viewers outside this LAN will get an unreachable relay"
        fi
        exec turnserver -n --log-file=stdout --use-auth-secret \
          --static-auth-secret="$$TURN_SECRET" --realm=peerdesk \
          --min-port=49160 --max-port=49200 --fingerprint \
          --no-multicast-peers \
          --listening-ip="$$TURN_PRIVATE_IP" --relay-ip="$$TURN_PRIVATE_IP" $$MAP

  api:
    build:
      context: ../server/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-peerdesk}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-peerdesk}
      JWT_SECRET: ${JWT_SECRET}
      SAVED_PW_KEY: ${SAVED_PW_KEY:-}
      TURN_SECRET: ${TURN_SECRET}
      TURN_HOST: ${TURN_HOST:-localhost}
      TURN_PORT: "3478"
      RELEASE_REPO: ${RELEASE_REPO:-Ancyent/peerdesk}
      RELEASE_REFRESH_SECONDS: ${RELEASE_REFRESH_SECONDS:-3600}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - release_cache:/var/lib/peerdesk/releases
    networks:
      - internal

  signaling:
    build:
      context: ../server/signaling
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  web:
    build:
      context: ../web
      args:
        VITE_SIGNALING_URL: ${VITE_SIGNALING_URL:-ws://localhost/ws}
        VITE_API_URL: ${VITE_API_URL:-http://localhost/api}
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./config.json:/etc/peerdesk/config.json:ro
    depends_on:
      - api
      - signaling
      - web
    networks:
      - internal

volumes:
  postgres_data:
  release_cache:

networks:
  internal:
    driver: bridge
