services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: peerdesk
      POSTGRES_PASSWORD: peerdesk
      POSTGRES_DB: peerdesk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peerdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  signaling:
    build:
      context: ../server/signaling
    ports:
      - "8001:8001"
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../server/signaling:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

  api:
    build:
      context: ../server/api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://peerdesk:peerdesk@postgres:5432/peerdesk
      JWT_SECRET: dev-jwt-secret-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../server/api:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
