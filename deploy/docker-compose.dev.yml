services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: peerdesk
      POSTGRES_PASSWORD: peerdesk
      POSTGRES_DB: peerdesk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peerdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  coturn:
    image: coturn/coturn:latest
    network_mode: host
    command: >
      -n
      --log-file=stdout
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET:-dev-turn-secret}
      --realm=peerdesk
      --min-port=49152
      --max-port=65535
      --no-stun
      --fingerprint
      --no-loopback-peers
      --no-multicast-peers

  signaling:
    build:
      context: ../server/signaling
    ports:
      - "8001:8001"
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../server/signaling:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

  api:
    build:
      context: ../server/api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://peerdesk:peerdesk@postgres:5432/peerdesk
      JWT_SECRET: dev-jwt-secret-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../server/api:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  web:
    build:
      # Repo root, not ../web — see the note in docker-compose.yml. shared/ is
      # mounted alongside web/ so the `@pd/ui` alias resolves during dev too,
      # and Vite's server.fs.allow already covers the repo root.
      context: ..
      dockerfile: web/Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ../web:/repo/web
      - /repo/web/node_modules
      - ../shared:/repo/shared
      # Vite resolves this as ../deploy/config.json from the app dir, which
      # moved from /app to /repo/web.
      - ./config.json:/repo/deploy/config.json:ro
    environment:
      VITE_PROXY_API: http://api:8000
      VITE_PROXY_WS: ws://signaling:8001
    depends_on:
      - api
      - signaling

volumes:
  postgres_data:
