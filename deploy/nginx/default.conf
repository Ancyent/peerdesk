upstream api {
    server api:8000;
}

upstream signaling {
    server signaling:8001;
}

upstream web_app {
    server web:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # WebSocket signaling — must match before /api
    location /ws {
        proxy_pass http://signaling;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite X-Forwarded-For — never append. The signaling server's
        # _client_ip() trusts the FIRST entry, so whatever a client sends must
        # be discarded here. Without this, a request can forge its own source
        # IP: the per-IP rate limiter then buckets under an attacker-chosen key
        # and the audit log records a false viewer_ip. (Verified against the
        # live stack: a spoofed header reached the app and was logged verbatim.)
        # $proxy_add_x_forwarded_for does NOT fix this — it appends, leaving the
        # forged value first. An external reverse proxy in front must likewise
        # overwrite this header with the real client address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Release binaries are ~20MB. Buffering them would spool each response to a
    # temp file before the client sees a byte; stream instead.
    location /api/releases/download/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # REST API — strip /api prefix before forwarding
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Runtime config — editable without rebuild
    location = /config.json {
        alias /etc/peerdesk/config.json;
        add_header Cache-Control "no-cache, no-store";
        add_header Content-Type "application/json";
    }

    # React SPA — everything else
    location / {
        proxy_pass http://web_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
